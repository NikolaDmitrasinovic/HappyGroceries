version: 2

updates:
 - package-ecosystem: "nuget"
   directory: "/apps/api"
   schedule:
    interval: "weekly"
   open-pull-requests-limit: 3
   labels:
    - "CI"
   commit-message:
    prefix: "ci(dependabot)"
   pull-request-branch-name:
    separator: "-"

 - package-ecosystem: "github-actions"
   directory: "/"
   schedule:
    interval: "weekly"
   open-pull-requests-limit: 2
   labels:
    - "CI"
   commit-message:
    prefix: "ci(dependabot)"
   pull-request-branch-name:
    separator: "-"