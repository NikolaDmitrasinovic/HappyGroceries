version: 2

updates:
 - package-ecosystem: "nuget"
   directory: "/apps/api"
   schedule:
    interval: "weekly"
   open-pull-requests-limit: 3
   labels:
    - "CI"
   reviewers:
    - "NikolaDmitrasinovic"
   commit-message:
    prefix: "ci(dependabot)"
   pull-request-branch-name:
    separator: "-"
   groups:
    nuget-minor-and-patch:
     patterns:
      - "*"
     update-types:
      - "minor"
      - "patch"

 - package-ecosystem: "github-actions"
   directory: "/"
   schedule:
    interval: "weekly"
   open-pull-requests-limit: 2
   labels:
    - "CI"
   reviewers:
    - "NikolaDmitrasinovic"
   commit-message:
    prefix: "ci(dependabot)"
   pull-request-branch-name:
    separator: "-"
   groups:
    actions-minor-and-patch:
     patterns:
      - "*"
     update-types:
      - "minor"
      - "patch"
