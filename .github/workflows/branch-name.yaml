name: Validate branch name

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
 contents: read
 issues: read

jobs:
  branch-name:
    name: Check PR source branch name
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch name format
        shell: bash
        env:
         GH_TOKEN: ${{ github.token }}
         BRANCH: ${{ github.head_ref }}
         ACTOR: ${{ github.actor }}
         REPOSITORY: ${{ github.repository }}
         
        run: |
          set -euo pipefail
          
          echo "Validating branch: $BRANCH"
          echo "Actor: $ACTOR"

          if [[ "$ACTOR" == "dependabot[bot]" || "$BRANCH" == dependabot/* ]]; then
           echo "✅ Dependabot PR detected. Skipping branch name validation."
           exit 0
          fi

          # Allowed:
          # <type>/<SCOPE>(-<issueNumber>)?_<kebab-case>

          TYPES='(feat|fix|refactor|chore|docs|test|ci|hotfix)'
          ISSUE_TYPES='feat|fix|chore'
          SCOPES='(BE|FE|CI|INFRA|DOCS)'
          REGEX="^${TYPES}\/${SCOPES}(-[0-9]+)?_[a-z0-9]+(-[a-z0-9]+)*$"

          if [[ "$BRANCH" =~ $REGEX ]]; then
           TYPE="${BASH_REMATCH[1]}"
           SCOPE="${BASH_REMATCH[2]}"
           ISSUE_RAW="${BASH_REMATCH[3]}"
           ISSUE="${ISSUE_RAW#-}"

           echo "Type : $TYPE"
           echo "Scope : $SCOPE"
           echo "Issue : ${ISSUE:-none}"

           if [[ "$TYPE" =~  ^(${ISSUE_TYPES})$ ]] && [[ -z "$ISSUE" ]]; then
            echo ""
            echo "❌ Issue number is required for type '$TYPE'"
            exit 1
           fi

           if [[ -n "$ISSUE" ]]; then            
            STATE="$(gh api "repos/${REPOSITORY}/issues/${ISSUE}" --jq '.state' 2>/dev/null || true)"

            if [[ -z "$STATE" ]]; then
             echo ""
             echo "❌ Issue #$ISSUE does not exist or cannot be accessed."
             exit 1
            fi

            if [[ "$STATE" != "open" ]]; then
             echo ""
             echo "❌ Issue #$ISSUE must be open. Current state: $STATE"
             exit 1
            fi
           fi

           if [[ "$TYPE" == "docs" ]] && [[ "$SCOPE" != "DOCS" ]]; then
            echo ""
            echo "❌ DOCS scope required for docs type PR"
            exit 1
           fi

           if [[ "$TYPE" == "ci" ]] && [[ "$SCOPE" != "CI" ]]; then
            echo ""
            echo "❌ CI scope required for ci type PR"
            exit 1
           fi

           if [[ "$SCOPE" =~ ^(BE|FE)$ ]] && [[ "$TYPE" =~ ^(docs|ci)$ ]]; then
            echo ""
            echo "❌ Scope '$SCOPE' cannot be used with type '$TYPE'"
            exit 1
           fi
           
           echo "✅ Branch name is valid."
          else
           echo ""
           echo "❌ Invalid branch name: $BRANCH"
           echo ""
           echo "Expected format:"
           echo " <type>/<SCOPE>-<issue?>_<short-description>"
           echo ""
           echo "Check documentation for rules/examples"
           exit 1
          fi
